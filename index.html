<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Harman · Giriş</title>
<style>:root{--bg:#0e1116;--bg2:#161a21;--fg:#eceae4;--fg2:#aab0b9;--line:#2a303a;--accent:#f2b25a}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:18px/1.6 -apple-system,system-ui,"Segoe UI",sans-serif}main{min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px)) 24px max(16px,env(safe-area-inset-right,0px))}.k{width:100%;max-width:420px;background:var(--bg2);border:1px solid var(--line);border-radius:24px;padding:28px 24px;box-shadow:0 20px 60px rgba(0,0,0,.4)}h1{font-size:26px;margin:0 0 6px;letter-spacing:-.01em}p{color:var(--fg2);margin:0 0 18px;font-size:16px}input{width:100%;box-sizing:border-box;font:700 34px/1 ui-monospace,Menlo,monospace;letter-spacing:.35em;text-align:center;padding:16px 10px;border-radius:14px;border:2px solid var(--line);background:#0b0e13;color:var(--fg);outline:none}input:focus{border-color:var(--accent)}button{width:100%;margin-top:14px;min-height:52px;font:700 18px system-ui,sans-serif;border:0;border-radius:14px;background:var(--accent);color:#1a1a1a;cursor:pointer}.hata{color:#ff8a80;min-height:24px;margin-top:10px;font-size:15px}.k.sars{animation:s .35s}@keyframes s{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}small{display:block;margin-top:14px;color:var(--fg2);font-size:13px}</style></head>
<body><main><form class="k" id="f" autocomplete="off"><h1>Harman</h1><p>Altı haneli parolayı gir.</p><input id="p" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="••••••" autofocus><button type="submit">Aç</button><div class="hata" id="h"></div><small>Özel çalışma notları.</small></form></main>
<script>
async function oz(t){const b=new TextEncoder().encode("kilavuz-"+t);const d=await crypto.subtle.digest("SHA-256",b);return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,"0")).join("").slice(0,10);}
const f=document.getElementById("f"),p=document.getElementById("p"),h=document.getElementById("h");
try{const k=sessionStorage.getItem("harman_slug");if(k)location.replace("s/"+k+"/index.html");}catch(e){}
f.addEventListener("submit",async e=>{e.preventDefault();const v=p.value.trim();if(!/^\d{6}$/.test(v)){h.textContent="Altı rakam gir.";return;}const s=await oz(v);
 try{const r=await fetch("s/"+s+"/index.html",{method:"HEAD"});if(!r.ok)throw 0;try{sessionStorage.setItem("harman_slug",s);}catch(_){}location.href="s/"+s+"/index.html";}
 catch(_){h.textContent="Parola yanlış.";f.classList.remove("sars");void f.offsetWidth;f.classList.add("sars");p.select();}});
</script></body></html>
