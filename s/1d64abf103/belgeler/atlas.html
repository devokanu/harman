<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}body{margin:0}</style></head><body><title>Hediye Tetikli Yayın Atlası</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>/* Hediye Tetikli Yayın Atlası — v2 tasarım.
   Kimlik: "yayın rejisi": koyu grafit zemin üzerinde skorbord kehribarı; açık temada serin kâğıt. Her bölüm bir "bant" (hero) + içindekiler şeridi + kartlar.
   Tipografi: Bricolage Grotesque (başlık), IBM Plex Sans (metin), IBM Plex Mono (sayı/etiket). */
:root{
  --bg:#eef0f3; --bg2:#ffffff; --bg3:#e3e7ec; --fg:#141a22; --fg2:#55606d; --fg3:#8a94a1; --line:#d5dbe3; --line2:#c3cad4;
  --accent:#b65c0a; --accent2:#f2b25a; --accent-ink:#ffffff; --accentbg:#fbead6;
  --ok:#1f7a4d; --warn:#a96b0a; --bad:#b3261e; --info:#1f5fa8;
  --okbg:#e2f3ea; --warnbg:#fbefd8; --badbg:#fbe3e1; --infobg:#e1ecf9;
  --sema-bg:#f6f7f9; --sema-box:#ffffff; --sema-line:#c3cad4; --sema-fg:#141a22; --sema-mask:rgba(20,26,34,.07);
  --bar:#b65c0a; --bar2:#e8dccd; --shadow:0 1px 2px rgba(20,26,34,.06),0 8px 24px -16px rgba(20,26,34,.25);
  --fd:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif; --fb:"IBM Plex Sans",system-ui,-apple-system,sans-serif; --fm:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:14px; --sw:264px; color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1218; --bg2:#151b24; --bg3:#1c2430; --fg:#e9e7e2; --fg2:#aab2bd; --fg3:#7d8794; --line:#273140; --line2:#344050;
  --accent:#f2b25a; --accent2:#b65c0a; --accent-ink:#1a1206; --accentbg:#2a2214;
  --ok:#62d394; --warn:#f2b25a; --bad:#ff7b72; --info:#7db6ff;
  --okbg:#15301f; --warnbg:#332812; --badbg:#3a1b19; --infobg:#17283d;
  --sema-bg:#111821; --sema-box:#1b2430; --sema-line:#3a4656; --sema-fg:#e9e7e2; --sema-mask:rgba(233,231,226,.07);
  --bar:#f2b25a; --bar2:#2c3645; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -18px rgba(0,0,0,.8); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0e1218; --bg2:#151b24; --bg3:#1c2430; --fg:#e9e7e2; --fg2:#aab2bd; --fg3:#7d8794; --line:#273140; --line2:#344050;
  --accent:#f2b25a; --accent2:#b65c0a; --accent-ink:#1a1206; --accentbg:#2a2214;
  --ok:#62d394; --warn:#f2b25a; --bad:#ff7b72; --info:#7db6ff;
  --okbg:#15301f; --warnbg:#332812; --badbg:#3a1b19; --infobg:#17283d;
  --sema-bg:#111821; --sema-box:#1b2430; --sema-line:#3a4656; --sema-fg:#e9e7e2; --sema-mask:rgba(233,231,226,.07);
  --bar:#f2b25a; --bar2:#2c3645; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -18px rgba(0,0,0,.8); color-scheme:dark; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--fb);font-size:15.5px;line-height:1.6}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
h1,h2,h3,h4{font-family:var(--fd);line-height:1.12;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(1.8rem,3.4vw,2.6rem);font-weight:800}
h2{font-size:clamp(1.5rem,2.6vw,2.1rem);font-weight:800}
h3{font-size:1.2rem;font-weight:700;margin-block:1.8rem .6rem;padding-top:.2rem}
h4{font-size:1rem;font-weight:700;margin-block:1rem .35rem}
p{margin:.35rem 0 .85rem;max-width:74ch}
ul,ol{padding-left:1.25rem;max-width:82ch}li{margin:.3rem 0}
code,.mono{font-family:var(--fm);font-size:.9em}
/* iskelet */
#app{display:grid;grid-template-columns:var(--sw) minmax(0,1fr);min-height:100vh}
#app>div{min-width:0}
nav.side{position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line);background:var(--bg2);padding-block:20px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:14px}
nav.side .brand{font-family:var(--fd);font-weight:800;font-size:1.1rem;letter-spacing:-.01em;margin-bottom:2px}
nav.side .brand::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--accent);margin-right:8px;vertical-align:1px}
nav.side .sub{font-size:.78rem;color:var(--fg2);margin-bottom:16px;line-height:1.4}
nav.side a{display:flex;align-items:baseline;gap:10px;padding:8px 10px;border-radius:10px;color:var(--fg);font-size:.93rem;border-left:3px solid transparent}
nav.side a:hover{background:var(--bg3);text-decoration:none}
nav.side a.on{background:var(--accentbg);border-left-color:var(--accent);font-weight:600}
nav.side a .n{font-family:var(--fm);font-size:.72rem;color:var(--fg3);min-width:1.3em}
nav.side .meta{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:.76rem;color:var(--fg2);line-height:1.5}
main{min-width:0;padding-block:0 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main>section{max-width:1120px;margin:0 auto 16px;min-width:0}
/* bölüm bandı */
.hero{padding:28px 0 18px;border-bottom:1px solid var(--line);margin-bottom:18px}
.eyebrow{font-family:var(--fm);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.lead{font-size:1.06rem;color:var(--fg2);max-width:76ch;margin-top:.5rem}
.subnav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.subnav a{font-size:.8rem;padding:5px 10px;border-radius:999px;background:var(--bg3);color:var(--fg2);font-family:var(--fm)}
.subnav a:hover{background:var(--accentbg);color:var(--accent);text-decoration:none}
/* özet kutucukları */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:14px 0}
.tile{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.tile .k{font-family:var(--fd);font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .l{font-size:.78rem;color:var(--fg2);margin-top:4px}
/* ızgara ve kart */
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.grid>*{min-width:0}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0;box-shadow:var(--shadow)}
.card>h3:first-child,.card>h4:first-child{margin-top:0}
.card.flat{box-shadow:none}
.card .kicker{font-family:var(--fm);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3);margin-bottom:6px}
/* etiketler */
.chip{display:inline-block;font-family:var(--fm);font-size:.72rem;padding:3px 9px;border-radius:999px;background:var(--bg3);color:var(--fg2);margin:2px 5px 2px 0;white-space:nowrap;line-height:1.3}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.bad{background:var(--badbg);color:var(--bad)}.chip.info{background:var(--infobg);color:var(--info)}
/* tablolar */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--bg2);margin:8px 0 6px}
table{border-collapse:collapse;width:100%;font-size:.87rem}
th,td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--line)}
th{font-family:var(--fd);font-weight:700;font-size:.78rem;letter-spacing:.03em;text-transform:uppercase;color:var(--fg2);position:sticky;top:0;background:var(--bg3)}
tbody tr:nth-child(even) td{background:color-mix(in oklab,var(--bg3) 35%,var(--bg2))}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--fm)}
tr:last-child td{border-bottom:0}
.bar{display:inline-block;height:9px;border-radius:5px;background:var(--bar2);width:64px;vertical-align:middle;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--bar);border-radius:5px}
.score{display:inline-flex;gap:6px;align-items:center;font-family:var(--fm);font-size:.78rem;white-space:nowrap}
/* kontroller */
.controls{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 14px}
.controls select,.controls input,.controls button{font:inherit;font-size:.88rem;padding:7px 11px;border-radius:10px;border:1px solid var(--line2);background:var(--bg2);color:var(--fg)}
.controls button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.controls button:focus-visible,nav a:focus-visible,.tabbtn:focus-visible,.fcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 16px}
.tabbtn{font:inherit;font-size:.86rem;padding:7px 13px;border-radius:999px;border:1px solid var(--line2);background:var(--bg2);color:var(--fg);cursor:pointer}
.tabbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
/* zaman çizelgesi */
.timeline{border-left:2px solid var(--line2);margin-left:8px;padding-left:18px}
.timeline .ev{position:relative;margin:0 0 14px}
.timeline .ev::before{content:"";position:absolute;left:-25px;top:8px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.timeline .d{font-family:var(--fm);font-size:.76rem;color:var(--fg2)}
/* fikir kartları */
.fcard{cursor:pointer;display:flex;flex-direction:column;gap:8px;padding:12px;transition:transform .12s ease,border-color .12s ease}
.fcard:hover{border-color:var(--accent);transform:translateY(-1px)}
.fcard .mock{aspect-ratio:9/12;width:100%;background:var(--bg3);border-radius:10px;overflow:hidden}
.fcard .mock img,.mock svg{width:100%;height:100%;object-fit:cover;display:block}
.fcard .t{font-family:var(--fd);font-weight:800;font-size:1.05rem;line-height:1.2}
.fcard .s{font-size:.86rem;color:var(--fg2)}
.detail{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-top:16px;box-shadow:var(--shadow)}
.detail .top{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px}
@media (max-width:760px){.detail .top{grid-template-columns:1fr}}
.detail .vis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.detail .vis figure{margin:0;min-width:0}
.detail .vis img{width:100%;height:auto;border-radius:10px;display:block}
figcaption{font-size:.76rem;color:var(--fg2);margin-top:5px;line-height:1.4}
.varlik{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.varlik .v{border:1px solid var(--line);border-radius:12px;padding:12px;font-size:.88rem;background:var(--bg)}
.varlik .v b{display:block;font-family:var(--fd);margin-bottom:6px}
/* adımlar */
.steps{counter-reset:s;padding-left:0}.steps li{list-style:none;position:relative;padding-left:2.3em;margin:.5rem 0}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:.05em;width:1.7em;height:1.7em;border-radius:50%;background:var(--accentbg);color:var(--accent);font-family:var(--fm);font-size:.74rem;font-weight:600;display:grid;place-items:center}
/* örnek kartları ve galeri */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.gallery figure{margin:0;background:var(--bg2);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.gallery img{width:100%;height:150px;object-fit:cover;object-position:top;display:block;cursor:zoom-in}
.gallery figcaption{padding:8px 10px;font-size:.74rem}
.ex{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr)}
@media (max-width:700px){.ex{grid-template-columns:1fr}}
.ex img{width:100%;height:100%;min-height:200px;object-fit:cover;object-position:top;display:block;cursor:zoom-in}
.ex .b{padding:14px 16px;min-width:0}
.ex .b h4{margin:0 0 4px}
.ex .src{font-size:.74rem;color:var(--fg2);font-family:var(--fm);margin-bottom:8px;word-break:break-all}
details.acc{border:1px solid var(--line);border-radius:12px;background:var(--bg2);padding:0 14px;margin:8px 0}
details.acc summary{cursor:pointer;padding:10px 0;font-weight:600;font-family:var(--fd);list-style:none;display:flex;justify-content:space-between;align-items:center}
details.acc summary::after{content:"+";font-family:var(--fm);color:var(--fg3)}
details.acc[open] summary::after{content:"–"}
details.acc>div{padding:0 0 12px}
.quote{border-left:3px solid var(--accent);padding:8px 14px;margin:10px 0;background:var(--bg2);border-radius:0 10px 10px 0;font-size:.92rem}
.quote .src{display:block;font-size:.74rem;color:var(--fg2);margin-top:6px;font-family:var(--fm)}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;align-items:end}
.calc label{font-size:.78rem;color:var(--fg2);display:block}
.calc input,.calc select{width:100%;font:inherit;padding:7px 9px;border-radius:10px;border:1px solid var(--line2);background:var(--bg);color:var(--fg)}
.kpi{font-family:var(--fd);font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums}
.note{font-size:.8rem;color:var(--fg2)}
.callout{border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--bg2);border-radius:0 12px 12px 0;padding:12px 16px;margin:12px 0}
.callout.bad{border-left-color:var(--bad)}.callout.ok{border-left-color:var(--ok)}
.lb{font:600 11px var(--fb);fill:var(--sema-fg)}.lbs{font:10px var(--fb);fill:var(--fg2)}.lbw{font:600 10px var(--fb);fill:var(--sema-fg)}.sm{font:9px var(--fm);fill:var(--fg2)}.big{font:800 26px var(--fd);fill:var(--sema-fg)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.84);display:grid;place-items:center;z-index:50;padding:20px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:92vh;border-radius:8px}
.lightbox .cap{position:absolute;left:16px;right:16px;bottom:12px;color:#fff;font-size:.8rem;text-align:center}
.topbar{display:none}
@media (max-width:900px){
  #app{grid-template-columns:1fr}
  nav.side{display:none}
  .topbar{display:block;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg2);border-bottom:1px solid var(--line)}
  .topbar .row{display:flex;gap:6px;overflow-x:auto;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));scrollbar-width:none}
  .topbar a{white-space:nowrap;font-size:.84rem;padding:6px 11px;border-radius:999px;border:1px solid var(--line2);color:var(--fg)}
  .topbar a.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .topbar a .n{display:none}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg2)}
  .hero{padding-top:18px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media print{nav.side,.topbar{display:none}#app{display:block}}

/* Tema v2 (Atlas): ölçek, bölüm şeritleri, kategori renkleri. */
:root{ --katil:#1f7a4d; --deney:#b65c0a; --versus:#b3261e; --karakter:#6a4c93; --fg2:#4d5560; }
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --katil:#62d394; --deney:#f2b25a; --versus:#ff7b72; --karakter:#c9a7ff; --fg2:#bcc3cc; --fg3:#8e97a3; } }
:root[data-theme="dark"]{ --katil:#62d394; --deney:#f2b25a; --versus:#ff7b72; --karakter:#c9a7ff; --fg2:#bcc3cc; --fg3:#8e97a3; }
html,body{font-size:17px;line-height:1.7}
h1{font-size:clamp(2rem,3.8vw,3rem)}
h2{font-size:clamp(1.7rem,3vw,2.4rem)}
h3{font-size:1.4rem;padding-left:.8rem;border-left:5px solid var(--accent);margin-block:2.2rem .7rem;line-height:1.2}
h4{font-size:1.1rem}
.lead{font-size:1.15rem;line-height:1.6}
main>section{background:var(--bg2);border:1px solid var(--line);border-radius:26px;padding:30px 36px 34px;box-shadow:var(--shadow);position:relative;overflow:hidden;margin-bottom:22px}
main>section::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:linear-gradient(180deg,var(--accent),var(--accent2))}
main>section#formatlar::before,main>section#fikirler::before,main>section#lab::before{background:linear-gradient(180deg,var(--katil),var(--accent2))}
main>section#versus::before,main>section#strateji::before{background:linear-gradient(180deg,var(--versus),var(--accent2))}
main>section#rehber::before,main>section#kaynaklar::before{background:linear-gradient(180deg,var(--karakter),var(--accent2))}
main>section#konular::before,main>section#bosluk::before,main>section#trend::before{background:linear-gradient(180deg,var(--deney),var(--accent2))}
.hero{padding:6px 0 18px;border-bottom:2px solid var(--line);margin-bottom:22px}
.eyebrow{display:inline-block;background:var(--accent);color:var(--accent-ink);font-size:.78rem;padding:6px 11px;border-radius:8px;letter-spacing:.12em;margin-bottom:12px}
main>section#formatlar .eyebrow,main>section#fikirler .eyebrow,main>section#lab .eyebrow{background:var(--katil);color:#fff}
main>section#versus .eyebrow,main>section#strateji .eyebrow{background:var(--versus);color:#fff}
main>section#rehber .eyebrow,main>section#kaynaklar .eyebrow{background:var(--karakter);color:#fff}
main>section#konular .eyebrow,main>section#bosluk .eyebrow,main>section#trend .eyebrow{background:var(--deney);color:#fff}
.subnav a{font-size:.88rem;padding:6px 12px}
.tiles{gap:14px}.tile{padding:16px 18px;border-radius:16px;border-top:5px solid var(--accent);box-shadow:var(--shadow)}
.tiles>.tile:nth-child(4n+2){border-top-color:var(--katil)}.tiles>.tile:nth-child(4n+3){border-top-color:var(--deney)}.tiles>.tile:nth-child(4n+4){border-top-color:var(--karakter)}
.tile .k{font-size:1.9rem}.tile .l{font-size:.9rem}
.card{border-top:5px solid var(--accent);border-radius:18px;padding:20px 22px}
.grid>.card:nth-child(4n+2){border-top-color:var(--katil)}.grid>.card:nth-child(4n+3){border-top-color:var(--deney)}.grid>.card:nth-child(4n+4){border-top-color:var(--karakter)}
.card .kicker{font-size:.78rem;color:var(--accent)}
.chip{font-size:.8rem;padding:4px 11px;font-weight:600}
table{font-size:.95rem}th{font-size:.8rem;background:var(--accentbg);color:var(--accent);border-bottom:2px solid var(--accent);padding:12px 14px}td{padding:12px 14px;line-height:1.5}
tr:nth-child(even) td{background:color-mix(in srgb,var(--bg3) 55%,transparent)}
.tbl{border-radius:16px;box-shadow:var(--shadow)}
.score{font-size:.86rem}
.tabbtn{font-size:.95rem;padding:8px 15px}
.timeline .d{font-size:.86rem;color:var(--accent)}
.fcard .t{font-size:1.2rem}.fcard .s{font-size:.95rem}
.detail{padding:24px;border-radius:20px;border-top:5px solid var(--accent)}
figcaption{font-size:.88rem;line-height:1.5}
.gallery figcaption{font-size:.84rem;padding:10px 12px}
.ex{border-radius:18px}.ex .b{padding:18px 20px}.ex .src{font-size:.82rem}
.varlik .v{font-size:.95rem;padding:14px 16px;border-radius:14px}
.steps li{font-size:1rem;padding-left:2.6em;margin:.7rem 0}
